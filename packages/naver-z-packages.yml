    registry: npm
    name: zep-script
    url: https://www.npmjs.com/package/zep-script
    install: npm install zep-script
    version: 0.16.5
    description: ZEP Script API for ZEP app
    publisher: zepdevelopers
    official: true
  - language: javascript
    registry: npm
    name: "@zep.us/zep-script-cli"
    url: https://www.npmjs.com/package/@zep.us/zep-script-cli
    install: npm install -g @zep.us/zep-script-cli
    description: Command-line tool for scaffolding, running and publishing ZEP Scripts
    publisher: zepdevelopers
    official: true
