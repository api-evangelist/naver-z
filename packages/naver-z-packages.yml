generated: '2026-07-20'
method: searched
source: https://www.npmjs.com/~zepdevelopers
notes: >-
  NAVER Z's ZEP product publishes a first-party JavaScript developer surface for
  building in-space apps/mini-games ("ZEP Script"). Packages are published on npm
  under the @zep.us scope and the zepdevelopers maintainer account, so they are
  treated as official. ZEPETO (the other NAVER Z product) ships no public client
  library — ZEPETO Studio is a Unity-based content-creation tool, not a package.
packages:
