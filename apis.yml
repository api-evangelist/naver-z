aid: naver-z
name: NAVER Z
description: 'NAVER Z Corporation is the South Korean metaverse subsidiary of NAVER,
  headquartered in Seongnam, Gyeonggi Province, with additional offices in Los Angeles
  and Tokyo. The company builds immersive digital experiences spanning ZEPETO, its
  avatar-based metaverse and social app launched in 2018; ZEP, a spatial collaboration
  and virtual-space platform launched in 2022; and Sticker.ly, a sticker creation
  and sharing app launched in 2019. NAVER Z''s public developer surface is ZEP Script:
  a first-party JavaScript SDK, CLI, and build toolchain (published on npm under the
  official @zep.us scope) that creators use to build in-space apps and mini-games,
  documented in the ZEP Guidebook at docs.zep.us with a dedicated ZEP Script API
  reference. NAVER Z publishes no REST/OpenAPI web API or OAuth program; ZEPETO
  Studio remains a Unity-based content-creation tool rather than an API surface.'
